[[mods]]
modId="faradayears"
version="1.0.0"
displayName="Faraday Ears & Tail Mod (Yellow Fire Style)"
displayURL="https://www.youtube.com/@YellowFire"
authors="Yellow Fire Modding Team & Arena AI"
description='''
Мод для Minecraft 1.19.2 Forge, добавляющий настраиваемые ушки и пушистый хвостик в стиле Фарадея с канала Yellow Fire!
Особенности:
 - Интерактивное GUI кастомизации по нажатию клавиши (по умолчанию 'V' или 'G')
 - Пресеты: Фарадей (Yellow Fire), Лис/Котик, Волк, Кролик
 - Точная настройка размеров (Ширина, Высота, Глубина), углов поворота и смещения ушек и хвоста
 - Возможность выбора цветов и собственной пиксельной отрисовки текстуры прямо в GUI
 - Синхронизация между игроками по сети (мультиплеер!)
'''

